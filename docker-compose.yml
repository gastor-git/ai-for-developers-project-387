services:
  db:
    image: alpine:3.20
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      - db
    environment:
      DB_PATH: ${DB_PATH:-/data/booking.db}
    volumes:
      - sqlite-data:/data
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  sqlite-data:
