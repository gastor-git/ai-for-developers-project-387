# TypeSpec project configuration.
# Compile with: npx tsp compile .
# Generated OpenAPI v3 contract goes to spec/dist/.

output-dir: "{project-root}/dist"
emit:
  - "@typespec/openapi3"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/dist"
    file-type:
      - yaml
      - json
